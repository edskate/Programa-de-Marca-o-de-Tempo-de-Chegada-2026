<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Chegada - Abizael e Renan</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center}
h1,h2,h3{color:#00ff66}.card{background:#111;border:1px solid #00ff66;border-radius:14px;padding:15px;margin:15px auto;max-width:950px;box-shadow:0 0 10px #003b18}
#relogio{font-size:28px;color:#00ff66;font-weight:bold;margin:10px 0}.oficial{font-size:42px;color:#00ff66;font-weight:bold;margin:8px 0}
#alertaDanca{margin-top:15px;padding:15px;border-radius:12px;border:2px solid #00ff66;font-size:23px;font-weight:bold;animation:piscar 1s infinite}
@keyframes piscar{0%{opacity:1}50%{opacity:.55}100%{opacity:1}}
select,input,textarea,button{width:95%;max-width:430px;padding:12px;margin:6px;border-radius:9px;border:none;font-size:16px}textarea{height:72px}button{background:#00aa44;color:white;font-weight:bold;cursor:pointer}button:hover{background:#00cc55}.btn-red{background:#aa0000}.btn-blue{background:#005bbb}.btn-gold{background:#a87900}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.mini{background:#050505;border:1px solid #444;border-radius:10px;padding:10px}.valor{font-size:25px;color:#00ff66;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border:1px solid #555;padding:8px}th{background:#222;color:#00ff66}.ok{color:#00ff66;font-weight:bold}.atraso{color:#ffd700;font-weight:bold}.critico{color:#ff8800;font-weight:bold}.grave{color:#ff4444;font-weight:bold}.resumo{background:#050505;border:1px solid gold;border-radius:10px;padding:10px;margin:12px 0;text-align:left}.resumo h3{text-align:center}
@media(max-width:600px){body{padding:10px}#relogio{font-size:22px}.oficial{font-size:34px}#alertaDanca{font-size:19px}table{font-size:12px}th,td{padding:6px}}
@media print{button,input,select,textarea{display:none}body{background:white;color:black}.card,.mini,.resumo{background:white;color:black;border:1px solid black;box-shadow:none}h1,h2,h3,#relogio,.oficial{color:black}#alertaDanca{animation:none;color:black!important;border-color:black!important}}
</style>
</head>
<body>
<h1>Controle de Chegada</h1>
<h2>Abizael e Renan</h2>

<div class="card">
  <h2>Relógio em Tempo Real</h2>
  <div id="relogio"></div>
  <h3>Horário Oficial para Estar Presente</h3>
  <div class="oficial" id="textoHorarioOficial">20:00</div>
  <input type="time" id="horarioOficial" value="20:00" onchange="salvarHorarioOficial()">
  <button class="btn-gold" onclick="salvarHorarioOficial()">Salvar Horário Oficial</button>
  <div id="alertaDanca">🕺 Horário Oficial: 20:00</div>
</div>

<div class="card">
  <h2>Registrar Chegada</h2>
  <select id="dancarino">
    <option>Abizael</option>
    <option>Renan</option>
  </select>
  <input type="date" id="data">
  <input type="time" id="hora" readonly>
  <textarea id="obs" placeholder="Observação do dia"></textarea>
  <button onclick="usarHoraAtual()">🕺 Marcar Chegada Agora</button>
  <button onclick="registrar()">Salvar Registro</button>
</div>

<div class="card">
  <h2>Indicadores Gerais</h2>
  <div class="grid" id="indicadores"></div>
</div>

<div class="card">
  <h2>Relatórios e Histórico</h2>
  <button class="btn-blue" onclick="window.print()">Salvar / Imprimir em PDF</button>
  <button class="btn-red" onclick="limpar()">Limpar Histórico</button>
  <div id="relatorio"></div>
</div>

<script>
const dancarinos = ["Abizael", "Renan"];
let registros = JSON.parse(localStorage.getItem("controleChegadaAbizaelRenan")) || [];
const horarioSalvo = localStorage.getItem("horarioOficialChegada") || "20:00";
document.getElementById("horarioOficial").value = horarioSalvo;
document.getElementById("textoHorarioOficial").textContent = horarioSalvo;
document.getElementById("data").valueAsDate = new Date();

function atualizarRelogio(){
  const agora = new Date();
  document.getElementById("relogio").innerHTML = agora.toLocaleDateString("pt-BR") + " - " + agora.toLocaleTimeString("pt-BR");
  atualizarAlerta();
}

function minutosDoHorario(horario){
  const p = horario.split(":");
  return Number(p[0]) * 60 + Number(p[1]);
}

function salvarHorarioOficial(){
  const h = document.getElementById("horarioOficial").value || "20:00";
  localStorage.setItem("horarioOficialChegada", h);
  document.getElementById("textoHorarioOficial").textContent = h;
  atualizarAlerta();
  mostrarRelatorio();
}

function atualizarAlerta(){
  const horario = document.getElementById("horarioOficial").value || "20:00";
  const limite = minutosDoHorario(horario);
  const agora = new Date();
  const atual = agora.getHours() * 60 + agora.getMinutes();
  const alerta = document.getElementById("alertaDanca");

  if(atual <= limite){
    alerta.innerHTML = "🕺✅ Dentro do horário para estar presente";
    alerta.style.color = "#00ff66"; alerta.style.borderColor = "#00ff66";
  }else if(atual <= limite + 30){
    alerta.innerHTML = "⚠️🕺 Chegada em atraso";
    alerta.style.color = "gold"; alerta.style.borderColor = "gold";
  }else if(atual < limite + 60){
    alerta.innerHTML = "🚨🕺 Atraso Crítico";
    alerta.style.color = "orange"; alerta.style.borderColor = "orange";
  }else{
    alerta.innerHTML = "❌🕺 Falta Grave";
    alerta.style.color = "#ff4444"; alerta.style.borderColor = "#ff4444";
  }
}

function usarHoraAtual(){
  const agora = new Date();
  const h = String(agora.getHours()).padStart(2,"0");
  const m = String(agora.getMinutes()).padStart(2,"0");
  document.getElementById("hora").value = h + ":" + m;
  document.getElementById("data").valueAsDate = agora;
}

function calcularStatus(hora){
  const totalMin = minutosDoHorario(hora);
  const limite = minutosDoHorario(document.getElementById("horarioOficial").value || "20:00");
  let status = "";
  let atraso = Math.max(0, totalMin - limite);
  if(totalMin <= limite){ status = "🕺✅ Presente no Horário"; atraso = 0; }
  else if(totalMin <= limite + 30){ status = "⚠️🕺 Atrasado"; }
  else if(totalMin < limite + 60){ status = "🚨🕺 Atraso Crítico"; }
  else{ status = "❌🕺 Falta Grave"; }
  return {status, atraso};
}

function registrar(){
  const nome = document.getElementById("dancarino").value;
  const data = document.getElementById("data").value;
  const hora = document.getElementById("hora").value;
  const obs = document.getElementById("obs").value;
  const oficial = document.getElementById("horarioOficial").value || "20:00";
  if(!data || !hora){ alert("Clique em Marcar Chegada Agora antes de salvar."); return; }
  const calc = calcularStatus(hora);
  registros.push({nome, data, hora, horarioOficial: oficial, status: calc.status, atraso: calc.atraso, obs});
  localStorage.setItem("controleChegadaAbizaelRenan", JSON.stringify(registros));
  document.getElementById("obs").value = "";
  document.getElementById("hora").value = "";
  mostrarRelatorio();
}

function classeStatus(status){
  if(status.includes("Atrasado")) return "atraso";
  if(status.includes("Crítico")) return "critico";
  if(status.includes("Falta")) return "grave";
  return "ok";
}

function formatarData(data){
  const p = data.split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : data;
}

function mostrarRelatorio(){
  const rel = document.getElementById("relatorio");
  const ind = document.getElementById("indicadores");
  if(registros.length === 0){
    rel.innerHTML = "<p>Nenhum registro salvo ainda.</p>";
    ind.innerHTML = "<div class='mini'><div class='valor'>0</div><p>Registros</p></div>";
    return;
  }
  const total = registros.length;
  const pontual = registros.filter(r => r.status.includes("Presente")).length;
  const atrasos = registros.filter(r => r.status.includes("Atrasado")).length;
  const criticos = registros.filter(r => r.status.includes("Crítico")).length;
  const graves = registros.filter(r => r.status.includes("Falta")).length;
  const perc = total ? (pontual / total) * 100 : 0;
  ind.innerHTML = `
    <div class="mini"><div class="valor">${total}</div><p>Total de registros</p></div>
    <div class="mini"><div class="valor">${perc.toFixed(1)}%</div><p>Pontualidade geral</p></div>
    <div class="mini"><div class="valor">${atrasos}</div><p>Atrasos</p></div>
    <div class="mini"><div class="valor">${criticos}</div><p>Atrasos críticos</p></div>
    <div class="mini"><div class="valor">${graves}</div><p>Faltas graves</p></div>`;

  let html = "";
  dancarinos.forEach(nome => {
    const lista = registros.filter(r => r.nome === nome);
    const t = lista.length;
    const p = lista.filter(r => r.status.includes("Presente")).length;
    const a = lista.filter(r => r.status.includes("Atrasado")).length;
    const c = lista.filter(r => r.status.includes("Crítico")).length;
    const g = lista.filter(r => r.status.includes("Falta")).length;
    const por = t ? (p / t) * 100 : 0;
    html += `<div class="resumo"><h3>🕺 ${nome}</h3><p>Total de registros: ${t}</p><p>Pontualidade: <strong>${por.toFixed(1)}%</strong></p><p>No horário: ${p}</p><p>Atrasos: ${a}</p><p>Atrasos críticos: ${c}</p><p>Faltas graves: ${g}</p></div>`;
    html += `<table><tr><th>Data</th><th>Hora</th><th>Horário Oficial</th><th>Status</th><th>Atraso</th><th>Observação</th></tr>`;
    if(t === 0){ html += `<tr><td colspan="6">Sem registros para ${nome}</td></tr>`; }
    lista.forEach(r => {
      html += `<tr><td>${formatarData(r.data)}</td><td>${r.hora}</td><td>${r.horarioOficial || "20:00"}</td><td class="${classeStatus(r.status)}">${r.status}</td><td>${r.atraso} min</td><td>${r.obs || "-"}</td></tr>`;
    });
    html += `</table>`;
  });
  rel.innerHTML = html;
}

function limpar(){
  if(confirm("Deseja apagar todo o histórico?")){
    localStorage.removeItem("controleChegadaAbizaelRenan");
    registros = [];
    mostrarRelatorio();
  }
}

setInterval(atualizarRelogio, 1000);
atualizarRelogio();
mostrarRelatorio();
</script>
</body>
</html>
