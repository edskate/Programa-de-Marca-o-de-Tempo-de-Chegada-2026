<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Chegada - Dançarinos</title>

<style>
body{
  margin:0;
  padding:15px;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1,h2{color:#00ff66;}

.card{
  background:#111;
  border:1px solid #00ff66;
  border-radius:12px;
  padding:15px;
  margin:15px auto;
  max-width:900px;
}

#relogio{
  font-size:28px;
  color:#00ff66;
  font-weight:bold;
}

select,input,textarea,button{
  width:95%;
  max-width:420px;
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

textarea{
  height:70px;
}

button{
  background:#00aa44;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00cc55;
}

.btn-red{
  background:#aa0000;
}

.btn-blue{
  background:#005bbb;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  font-size:14px;
}

th,td{
  border:1px solid #555;
  padding:8px;
}

th{
  background:#222;
  color:#00ff66;
}

.ok{color:#00ff66;font-weight:bold;}
.atraso{color:#ffd700;font-weight:bold;}
.critico{color:#ff8800;font-weight:bold;}
.grave{color:#ff4444;font-weight:bold;}

.resumo{
  background:#050505;
  border:1px solid gold;
  border-radius:10px;
  padding:10px;
  margin:10px 0;
}

@media print{
  button,input,select,textarea{
    display:none;
  }

  body{
    background:white;
    color:black;
  }

  .card{
    border:1px solid black;
    background:white;
    color:black;
  }

  h1,h2{
    color:black;
  }
}
</style>
</head>

<body>

<h1>Controle de Chegada dos Dançarinos</h1>

<div class="card">
  <h2>Relógio em Tempo Real</h2>
  <div id="relogio"></div>
</div>

<div class="card">
  <h2>Registrar Chegada</h2>

  <select id="dancarino">
    <option>Renan</option>
    <option>Abizael</option>
    <option>Patrick</option>
    <option>Jhonny Mendes</option>
    <option>João</option>
    <option>Murilo</option>
  </select>

  <input type="date" id="data">
  <input type="time" id="hora" readonly>

  <textarea id="obs" placeholder="Observação do dia"></textarea>

  <button onclick="usarHoraAtual()">Marcar Chegada Agora</button>
  <button onclick="registrar()">Salvar Registro</button>
</div>

<div class="card">
  <h2>Relatórios</h2>

  <button class="btn-blue" onclick="window.print()">Salvar / Imprimir em PDF</button>
  <button class="btn-red" onclick="limpar()">Limpar Histórico</button>

  <div id="relatorio"></div>
</div>

<script>
let registros = JSON.parse(localStorage.getItem("controleChegadaDancarinos")) || [];

document.getElementById("data").valueAsDate = new Date();

function atualizarRelogio(){
  const agora = new Date();

  const data = agora.toLocaleDateString("pt-BR");
  const hora = agora.toLocaleTimeString("pt-BR");

  document.getElementById("relogio").innerHTML = data + " - " + hora;
}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

function usarHoraAtual(){
  const agora = new Date();

  const horas = String(agora.getHours()).padStart(2,"0");
  const minutos = String(agora.getMinutes()).padStart(2,"0");

  document.getElementById("hora").value = `${horas}:${minutos}`;
  document.getElementById("data").valueAsDate = agora;
}

function registrar(){
  const nome = document.getElementById("dancarino").value;
  const data = document.getElementById("data").value;
  const hora = document.getElementById("hora").value;
  const obs = document.getElementById("obs").value;

  if(!data || !hora){
    alert("Clique em Marcar Chegada Agora antes de salvar.");
    return;
  }

  const partes = hora.split(":");
  const totalMin = Number(partes[0]) * 60 + Number(partes[1]);

  const limite = 20 * 60;
  const limiteAtraso = 20 * 60 + 30;
  const limiteGrave = 21 * 60;

  let status = "";
  let atraso = 0;

  if(totalMin <= limite){
    status = "Presente no horário";
    atraso = 0;
  }else if(totalMin <= limiteAtraso){
    status = "Atrasado";
    atraso = totalMin - limite;
  }else if(totalMin < limiteGrave){
    status = "Atraso crítico";
    atraso = totalMin - limite;
  }else{
    status = "Falta grave / chegada após 21:00";
    atraso = totalMin - limite;
  }

  registros.push({
    nome,
    data,
    hora,
    status,
    atraso,
    obs
  });

  localStorage.setItem("controleChegadaDancarinos", JSON.stringify(registros));

  document.getElementById("obs").value = "";
  document.getElementById("hora").value = "";

  mostrarRelatorio();
}

function mostrarRelatorio(){
  const div = document.getElementById("relatorio");

  if(registros.length === 0){
    div.innerHTML = "<p>Nenhum registro salvo ainda.</p>";
    return;
  }

  const nomes = [...new Set(registros.map(r => r.nome))];

  let html = "";

  nomes.forEach(nome=>{
    const lista = registros.filter(r => r.nome === nome);

    const total = lista.length;
    const pontual = lista.filter(r => r.status === "Presente no horário").length;
    const atrasado = lista.filter(r => r.status === "Atrasado").length;
    const critico = lista.filter(r => r.status === "Atraso crítico").length;
    const grave = lista.filter(r => r.status.includes("Falta grave")).length;

    const porcentagem = total > 0 ? (pontual / total) * 100 : 0;

    html += `
      <div class="resumo">
        <h3>${nome}</h3>
        <p>Total de registros: ${total}</p>
        <p>Pontualidade: <strong>${porcentagem.toFixed(1)}%</strong></p>
        <p>No horário: ${pontual}</p>
        <p>Atrasos: ${atrasado}</p>
        <p>Atrasos críticos: ${critico}</p>
        <p>Faltas graves: ${grave}</p>
      </div>

      <table>
        <tr>
          <th>Data</th>
          <th>Hora</th>
          <th>Status</th>
          <th>Atraso</th>
          <th>Observação</th>
        </tr>
    `;

    lista.forEach(r=>{
      let classe = "ok";

      if(r.status === "Atrasado") classe = "atraso";
      if(r.status === "Atraso crítico") classe = "critico";
      if(r.status.includes("Falta grave")) classe = "grave";

      html += `
        <tr>
          <td>${formatarData(r.data)}</td>
          <td>${r.hora}</td>
          <td class="${classe}">${r.status}</td>
          <td>${r.atraso} min</td>
          <td>${r.obs || "-"}</td>
        </tr>
      `;
    });

    html += "</table>";
  });

  div.innerHTML = html;
}

function formatarData(data){
  const p = data.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}

function limpar(){
  if(confirm("Deseja apagar todo o histórico?")){
    localStorage.removeItem("controleChegadaDancarinos");
    registros = [];
    mostrarRelatorio();
  }
}

mostrarRelatorio();
</script>
<hr>
<a href="index04.html"><h2>Next one</h2></a>
</body>
</html>
